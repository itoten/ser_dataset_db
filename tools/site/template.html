const tagged = s => esc(s).replace(/\[([a-z0-9_]+)\]/g, (m, id) => { const i = S.findIndex(x => x[0] === id); return i < 0 ? m : `[${S[i][1] ? `<a href="${esc(S[i][1])}" target="_blank" rel="noopener">${esc(id)}</a>` : esc(id)}]`; });
function openD(id) {
  const d = byId[id]; if (!d) return; state.open = id;
  const t = T(), f = t.f, who = b => b === "claude" ? f.by_ai : b === "script" ? f.by_script : f.by_user;
  const v = (k, x) => x ? esc(semi(x).map(y => vt(k, y)).join(", ")) + ` <span class="sub mono">${esc(x)}</span>` : "";
  const pair = (a, b) => [a ? `${esc(f.rep)}: <b class="mono">${esc(a)}</b>` : "", b ? `${esc(f.rel_)}: <b class="mono">${esc(b)}</b>` : ""].filter(Boolean).join(" · ");
  const summary = `<dl>${row(f.lang, esc(d._lang.map(c => `${langName(c)} (${c})`).join(", ")))}${row(f.langn, tagged(d.langn))}
    ${row(f.checked, [d.doc ? f.prim : "", d.impl ? f.readme : ""].filter(Boolean).join(", "))}${row(f.alias, esc(d.alias.map(a => a[0]).join(", ")))}${row(f.upd, esc(d.upd))}</dl>`;
  const size = `<dl>${row(f.ns, pair(d.ns, d.rs))}${row(f.nf, pair(d.nf, d.rf))}${row(f.h, pair(d.h, d.rh))}</dl>`;
  const how = `<dl>${row(f.sp, v("sp", d.sp))}${row(f.mo, v("mo", d.mo))}${row(f.vc, v("vc", d.vc))}${row(f.std, v("std", d.std))}
    ${row(f.lb, v("lb", d.lb))}${row(f.ls, v("ls", d.ls))}${row(f.lv, v("lv", d.lv))}${row(f.lt, v("lt", d.lt))}${row(f.split, v("split", d.split))}</dl>`;
  const rights = `<dl>${row(f.lic, `<span class="mono">${esc(d.lic)}</span>`)}${row(f.licn, tagged(d.licn))}${row(f.srn, tagged(d.srn))}
    ${row(f.am, v("am", d.am))}${row(f.ao, d.ao ? v("am", d.ao) + (d.aoo ? ` <span class="sub">${esc(f.on(d.aoo))}</span>` : "") : "")}</dl>`;
  const ann = d.ann.map(a => `<div><b>${esc(a[1])}</b> <span class="tag">${esc(vt("ann", a[0]))}</span>${a[2] ? `<div>${esc(f.labels)}: ${esc(semi(a[2]).join(", "))}</div>` : ""}
    <div class="sub">${[a[3] && `${f.scale}: ${a[3]}`, a[4] && `${f.annotator}: ${a[4]}`, a[5] && `${t.fac.lb}: ${vt("lb", a[5])}`, a[6] && `${t.fac.lv}: ${vt("lv", a[6])}`, a[7] && `${f.unit}: ${a[7]}`].filter(Boolean).map(esc).join(" · ")}</div>
    ${a[8] ? `<div class="note">${esc(a[8])}</div>` : ""}${a[9] >= 0 ? `<div class="sub">${srcLink(a[9])}${a[10] ? " — “" + esc(a[10]) + "”" : ""}</div>` : ""}</div>`).join("");
  const lc = d.lc.length ? `<div class="inner"><table class="ev"><thead><tr><th>${esc(f.label)}</th><th>${esc(f.n)}</th><th>${esc(f.hours)}</th><th>${esc(f.source)}</th></tr></thead><tbody>${d.lc.map(c => `<tr><td>${esc(c[1])} <span class="sub">${esc(c[0])}</span></td><td class="r">${esc(c[2])}</td><td class="r">${esc(c[3])}</td><td>${srcLink(c[4])}</td></tr>`).join("")}</tbody></table></div>` : "";
  const iss = d.iss.map(x => `<div><span class="tag">${esc(vt("iss", x[0]))}</span> ${esc(x[1])}${x[2] ? ` <span class="sub">(n = ${esc(x[2])})</span>` : ""}${x[3] >= 0 ? `<div class="sub">${srcLink(x[3])}${x[4] ? " — “" + esc(x[4]) + "”" : ""}</div>` : ""}</div>`).join("");
  const rel = d.rel.map(r => { const other = `<a href="#${esc(r[1])}" data-open="${esc(r[1])}">${esc((byId[r[1]] || {}).name || r[1])}</a>`;
    return `<div>${lang === "ja" ? `${other} ${esc(t.rel[r[0]] || r[0])}` : `${esc(t.rel[r[0]] || r[0])} ${other}`}${r[2] ? `<div class="note">${esc(r[2])}</div>` : ""}</div>`; }).join("");
  const docs = d.links.map(l => `<div><span class="tag">${esc(t.role[l[0]] || l[0])}</span> ${srcLink(l[1])}</div>`).join("");
  const ev = d.ev.length ? `<div class="inner"><table class="ev"><thead><tr><th>${esc(f.field)}</th><th>${esc(f.value)} / ${esc(f.source)}</th></tr></thead><tbody>${d.ev.map(e => `<tr><td class="k">${esc(e[0])}</td><td><b class="mono">${esc(e[1])}</b>${e[6] !== "current" ? ` <span class="st ${esc(e[6])}">${esc(f.status[e[6]] || e[6])}</span>` : ""}
    <div class="sub">${e[2] >= 0 ? srcLink(e[2]) : ""}${e[3] ? " — “" + esc(e[3]) + "”" : ""}</div><div class="sub">${esc(f.checked_on(e[4], who(e[5])))}</div>${e[6] === "provisional" && e[7] ? `<div class="note">${esc(e[7])}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : "";
  drawer.innerHTML = `<div class="dhead"><div><div class="sub mono">${esc(d.id)}</div><h3 id="d-title">${esc(d.name || d.id)}</h3>${d.full && d.full !== d.name ? `<div class="sub">${esc(d.full)}</div>` : ""}</div><button class="x" type="button" id="close">${esc(t.close)}</button></div>
    ${sec(t.sec.summary, summary)}${sec(t.sec.size, size)}${sec(t.sec.how, how)}${sec(t.sec.rights, rights)}${sec(t.sec.ann, ann)}${sec(t.sec.lc, lc)}${sec(t.sec.iss, iss)}
    ${sec(t.sec.notes, d.notes ? `<div class="note">${tagged(d.notes)}</div>` : "")}${sec(t.sec.rel, rel)}${sec(t.sec.docs, docs)}${sec(t.sec.ev, ev)}`;
  if (drawer.hidden) { drawer.hidden = false; scrim.hidden = false; drawer.scrollTop = 0; document.getElementById("close").focus(); }
}
function closeD() { drawer.hidden = true; scrim.hidden = true; state.open = null; }
drawer.addEventListener("click", e => { if (e.target.id === "close") closeD(); const a = e.target.closest("[data-open]"); if (a) { e.preventDefault(); drawer.scrollTop = 0; openD(a.dataset.open); } });
scrim.addEventListener("click", closeD);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) closeD(); });

applyLang();
const h = decodeURIComponent(location.hash.slice(1)); if (h && byId[h]) openD(h);
})();
</script>
